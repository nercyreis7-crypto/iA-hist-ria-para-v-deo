name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git \
          python3-dev ffmpeg libsdl2-dev \
          libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev \
          libavcodec-dev zlib1g-dev libgstreamer1.0 \
          gstreamer1.0-plugins-base openjdk-17-jdk \
          autoconf libtool pkg-config unzip zip

    - name: Accept Android SDK Licenses
      run: |
        # Usa ANDROID_SDK_ROOT que já existe e tem permissão no runner
        SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
        mkdir -p "$SDK_ROOT/licenses"
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
        echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_ROOT/licenses/intel-android-extra-license"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

    - name: Build APK
      run: |
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DirectorIA-APK
        path: bin/*.apk
        retention-days: 30
