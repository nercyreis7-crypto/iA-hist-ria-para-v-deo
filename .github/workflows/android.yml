name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]          # ✅ Testa PRs antes de mergear
  workflow_dispatch:             # ✅ Permite rodar manualmente no GitHub

jobs:
  build:
    runs-on: ubuntu-22.04        # ✅ Versão fixa (ubuntu-latest pode mudar e quebrar tudo)
    timeout-minutes: 60          # ✅ Evita jobs travados consumindo minutos grátis

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'             # ✅ Cache automático do pip (mais rápido)

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython==0.29.37"
        pip install "buildozer==1.5.0" "python-for-android==2024.1.21"

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq  # ✅ -qq silencia output desnecessário
        sudo apt-get install -y --no-install-recommends \
          build-essential git \
          python3-dev \
          ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev gstreamer1.0-plugins-base \
          openjdk-17-jdk \
          autoconf libtool pkg-config \
          unzip zip \
          libffi-dev libssl-dev \
          clang lld llvm

    - name: Set up Java 17                  # ✅ Garante que o Java correto está ativo
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Cache Buildozer global          # ✅ Cache separado por responsabilidade
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-global-${{ runner.os }}-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Build APK
      run: buildozer -v android debug 2>&1 | tee build.log  # ✅ Salva log em arquivo
      env:
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK
      if: success()              # ✅ Só sobe o APK se o build passou
      uses: actions/upload-artifact@v4
      with:
        name: DirectorIA-APK-${{ github.sha }}  # ✅ Nome único por commit
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log on failure     # ✅ Sobe o log se o build falhar
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.sha }}
        path: build.log
        retention-days: 7
