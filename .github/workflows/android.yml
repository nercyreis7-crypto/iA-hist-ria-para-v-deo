name: Android Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK
        env:
          ANDROIDSDK_ACCEPT_LICENSE: "1"
        run: |
          # Corrige permissões do diretório de trabalho
          chown -R user:user .
          # Executa o build dentro do container pré-configurado
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectorAI-APK
          path: bin/*.apk

