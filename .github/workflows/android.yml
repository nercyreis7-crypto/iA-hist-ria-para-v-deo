6name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Cython 3.x quebra o python-for-android — usar 0.29.x obrigatório
        pip install "cython==0.29.37"
        # Versões pinadas para garantir compatibilidade
        pip install "buildozer==1.5.0" "python-for-android==2024.1.21"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git \
          python3-dev \
          ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev gstreamer1.0-plugins-base \
          openjdk-17-jdk \
          autoconf libtool pkg-config \
          unzip zip \
          libffi-dev libssl-dev \
          clang lld llvm

    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Build APK (verbose)
      run: |
        yes | buildozer -v android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DirectorIA-APK
        path: bin/*.apk
        retention-days: 30
